<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --cream:#F3EEE4; --green:#48BB78; --orange:#ED8936;
    --red:#fc8181; --yellow:#ecc94b; --card:rgba(255,255,255,.045);
    --stroke:rgba(243,238,228,.10);
  }
  *{margin:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  body{font-family:'Onest',system-ui,sans-serif;color:var(--cream);position:relative}
  #stage{position:absolute;inset:0}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .eyebrow{font-weight:600;letter-spacing:.42em;font-size:20px;color:rgba(243,238,228,.5);text-transform:uppercase}
  .h-big{font-weight:900;line-height:1.02;letter-spacing:-.02em}
  .chip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--stroke);border-radius:999px;padding:10px 22px;font-weight:600}
  img{user-select:none;-webkit-user-drag:none}
  .card{background:var(--card);border:1px solid var(--stroke);border-radius:26px;backdrop-filter:blur(6px)}
  .led{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 18px 4px rgba(252,129,129,.8)}
  .stat-n{font-weight:900;font-size:96px;line-height:1}
  .stat-l{font-size:24px;color:rgba(243,238,228,.55);font-weight:600}
  .frameui{border-radius:22px;box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 1px rgba(243,238,228,.08);overflow:hidden}
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ============ asset paths (downloaded to work/) ============ */
const A = p => 'file:///' + 'c:/Users/1/Documents/UmirHackCaseOrange/SmartInventory/brag-output/work/' + p;
const IMG = {
  dash: A('01-dashboard.png'),
  sklad: A('02-sklad.png'),
  stop: A('05-stop.png'),
  paper: A('16-dashboard-paper.png'),
  matcha: A('17-dashboard-matcha.png'),
  lilac: A('18-dashboard-lilac.png'),
  avo: A('m-avo.png'),
  salmon: A('m-salmon.png'),
  lemon: A('m-lemon.png'),
  onigiri: A('m-onigiri.png'),
};
const FONT = 'Onest';

/* ============ helpers ============ */
const ease = t => t<0?0:t>1?1:t*t*(3-2*t);            // smoothstep
const easeO = t => 1-Math.pow(1-Math.min(Math.max(t,0),1),3);
const easeIO = t => t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// per-scene local progress
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

const stage=document.getElementById('stage');
function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

/* vignette + grain-lite backdrop reused across scenes */
function backdrop(){
  return `<div style="position:absolute;inset:0;background:
    radial-gradient(1200px 700px at 50% -10%,rgba(72,187,120,.08),transparent 60%),
    radial-gradient(900px 600px at 85% 110%,rgba(237,137,54,.07),transparent 60%),
    var(--bg)"></div>
   <div style="position:absolute;inset:0;box-shadow:inset 0 0 320px rgba(0,0,0,.6)"></div>`;
}

/* the freshness LED dot */
function led(color,size=14,glow=true){
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};
    ${glow?`box-shadow:0 0 ${size*1.4}px ${size*.3}px ${color}aa`:''}"></div>`;
}

/* ============ SCENES — each returns opacity/transform & builds DOM ============ */
const S = {}; // scene builders, keyed

/* --- 1. HOOK: led blips awake, tagline --- */
function scene1(t){
  const p=seg(t,0,2.5);
  const glowPulse = 0.5+0.5*Math.sin(t*9);
  const ledOp = clamp((t-0.15)/0.4,0,1);
  const tagOp = ease(seg(t,1.0,1.9));
  const tagY = lerp(26,0,easeO(seg(t,1.0,2.0)));
  const dashOp = ease(seg(t,1.6,2.5));
  const dashY = lerp(50,0,easeO(seg(t,1.6,2.5)));
  const dashSc = lerp(1.05,1.0,easeIO(seg(t,1.6,2.6)));
  return `
  ${backdrop()}
  <div class="scene" style="opacity:1">
    <div style="position:absolute;top:118px;left:0;right:0;text-align:center;opacity:${ledOp}">
      <div style="display:inline-flex;align-items:center;gap:16px">
        <div style="opacity:${0.4+0.6*glowPulse}">${led('#fc8181',15)}</div>
        <div class="eyebrow" style="color:rgba(243,238,228,.7)">мониторинг склада ресторана</div>
        <div style="opacity:${0.4+0.6*glowPulse}">${led('#48BB78',15)}</div>
      </div>
    </div>
    <div style="position:absolute;top:190px;left:0;right:0;text-align:center;
      opacity:${tagOp};transform:translateY(${tagY}px);z-index:5">
      <div class="h-big" style="font-size:96px;text-shadow:0 8px 40px rgba(0,0,0,.7)">Склад без просрочки</div>
    </div>
    <div style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
      padding-bottom:40px;opacity:${dashOp};transform:translateY(${dashY}px) scale(${dashSc})">
      <img src="${IMG.dash}" style="width:1360px" class="frameui">
    </div>
  </div>`;
}

/* --- 2. DASHBOARD hero + stat counters --- */
function scene2(t){
  const p=seg(t,2.5,6);
  const o=ease(seg(t,2.5,3.1));
  const sc=lerp(1.0,1.05,easeIO(seg(t,2.5,6)));
  const y=lerp(0,-24,easeIO(seg(t,2.5,6)));
  const stats=[
    {v:'−31%',l:'списаний за месяц',c:'#48BB78'},
    {v:'0',l:'просрочек за неделю',c:'#F3EEE4'},
    {v:'24/7',l:'мониторинг сроков',c:'#ED8936'},
  ];
  const cards=stats.map((s,i)=>{
    const cp=ease(seg(t,3.4+i*0.35,4.0+i*0.35));
    const cy=lerp(30,0,easeO(seg(t,3.4+i*0.35,4.1+i*0.35)));
    return `<div class="card" style="padding:34px 40px;text-align:center;opacity:${cp};transform:translateY(${cy}px);min-width:300px">
      <div class="stat-n" style="color:${s.c}">${s.v}</div>
      <div class="stat-l" style="margin-top:10px">${s.l}</div></div>`;
  }).join('<div style="width:30px"></div>');
  const cap=ease(seg(t,3.0,3.6));
  return `
  ${backdrop()}
  <div class="scene">
    <div class="eyebrow" style="opacity:${cap};margin-bottom:26px">дашборд · спираль свежести · обновляется по signalr</div>
    <div style="opacity:${o};transform:translateY(${y}px) scale(${sc})">
      <img src="${IMG.dash}" style="width:1180px" class="frameui">
    </div>
    <div style="display:flex;margin-top:44px">${cards}</div>
  </div>`;
}

/* --- 3. batch burns -> auto stop-list --- */
function scene3(t){
  const o=ease(seg(t,6,6.5));
  // two panels side by side: склад + stop-list
  const lp=seg(t,6,10);
  const heat=ease(seg(t,6.6,8.2));           // row heating to red
  const drop=ease(seg(t,8.2,9.4));           // stop-list lights up
  const check=ease(seg(t,9.2,10));           // green confirm
  const blink=0.5+0.5*Math.sin(t*12);
  const title=ease(seg(t,6.2,6.9));
  return `
  ${backdrop()}
  <div class="scene">
    <div class="eyebrow" style="opacity:${title};margin-bottom:8px">горит партия → блюдо само уходит в стоп</div>
    <div class="h-big" style="font-size:64px;opacity:${title};margin-bottom:36px">до кассы, а не после</div>
    <div style="display:flex;gap:44px;align-items:center;opacity:${o}">
      <div style="position:relative">
        <img src="${IMG.sklad}" style="width:820px" class="frameui">
        <div style="position:absolute;inset:0;border-radius:22px;
          background:rgba(252,60,60,${heat*0.16});box-shadow:inset 0 0 0 2px rgba(252,129,129,${heat*.7});
          opacity:${0.5+0.5*blink*heat}"></div>
        <div style="position:absolute;top:18px;left:22px;display:flex;gap:10px;align-items:center;
          background:rgba(15,17,21,.7);padding:10px 18px;border-radius:14px;opacity:${heat}">
          ${led('#fc8181',14)}<span style="font-weight:800;font-size:24px;color:#fc8181">2.4 ч · горит</span>
        </div>
      </div>
      <div style="font-size:64px;font-weight:900;color:rgba(243,238,228,.4);transform:translateX(${lerp(20,0,drop)}px);opacity:${drop}">→</div>
      <div style="position:relative">
        <img src="${IMG.stop}" style="width:820px" class="frameui;filter:saturate(${lerp(.4,1,drop)}) brightness(${lerp(.5,1,drop)})">
        <div style="position:absolute;top:18px;right:22px;display:flex;gap:10px;align-items:center;
          background:rgba(15,17,21,.75);padding:10px 18px;border-radius:14px;opacity:${check}">
          ${led('#48BB78',14)}<span style="font-weight:800;font-size:24px;color:#48BB78">стоп до кассы</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* --- 4. AI advisor + Limo --- */
function scene4(t){
  const o=ease(seg(t,10,10.6));
  const slide=easeO(seg(t,10,10.9));
  const lx=lerp(140,0,slide), lop=ease(seg(t,10.1,10.8));
  const lines=[
    '— что списать до конца смены',
    '— что заказать на завтра',
    '— что убрать из закупок',
  ];
  const li=lines.map((s,i)=>{
    const cp=ease(seg(t,10.7+i*0.5,11.4+i*0.5));
    const cy=lerp(22,0,easeO(seg(t,10.7+i*0.5,11.5+i*0.5)));
    return `<div style="opacity:${cp};transform:translateY(${cy}px);font-size:38px;font-weight:600;color:var(--cream);margin:14px 0">${s}</div>`;
  }).join('');
  const pulse=0.5+0.5*Math.sin(t*6);
  const title=ease(seg(t,10.2,10.8));
  return `
  ${backdrop()}
  <div class="scene">
    <div class="eyebrow" style="opacity:${title};margin-bottom:30px">ии-советник · каждую смену</div>
    <div style="display:flex;gap:70px;align-items:center;opacity:${o}">
      <div style="transform:translateX(${lx}px);opacity:${lop}">
        <img src="${IMG.lemon}" style="width:520px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))">
      </div>
      <div>
        <div class="h-big" style="font-size:72px;margin-bottom:26px">ИИ советует.</div>
        ${li}
        <div style="display:flex;gap:12px;align-items:center;margin-top:30px;opacity:${ease(seg(t,12.2,13))}">
          <div style="opacity:${0.5+0.5*pulse}">${led('#ED8936',13)}</div>
          <span style="color:rgba(243,238,228,.5);font-weight:600;font-size:22px">обновляется в реальном времени</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* --- 5. five themes snap-through --- */
function scene5(t){
  const o=ease(seg(t,14,14.4));
  const themes=[IMG.dash,IMG.paper,IMG.matcha,IMG.lilac];
  const names=['ночь','бумага','матча','лаванда'];
  // show each ~0.6s
  const idx=Math.min(themes.length-1, Math.floor(seg(t,14.2,16.6)*themes.length));
  const pop=easeO(seg(t,14.2+idx*0.6,14.6+idx*0.6));
  const chip=ease(seg(t,15.4,16));
  return `
  ${backdrop()}
  <div class="scene">
    <div class="eyebrow" style="opacity:${o};margin-bottom:30px">стеклянный · крупный · живой</div>
    <div style="position:relative;width:1300px;height:760px;display:flex;align-items:center;justify-content:center">
      <img src="${themes[idx]}" style="width:1300px;max-height:760px;object-fit:cover" class="frameui">
      <div style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);opacity:${o}">
        <div class="chip" style="background:rgba(15,17,21,.8);font-size:22px">тема «${names[idx]}»</div>
      </div>
    </div>
    <div class="chip" style="margin-top:36px;opacity:${chip};font-size:24px;border-color:var(--green)">
      ${led('#48BB78',12)}&nbsp;5 тем — один свотч в шапке
    </div>
  </div>`;
}

/* --- 6. outro --- */
function scene6(t){
  const o=ease(seg(t,17,17.6));
  const sc=lerp(1.06,1.0,easeIO(seg(t,17,18.5)));
  const url=ease(seg(t,18.0,18.7));
  const avo=easeO(seg(t,18.2,19.2));
  const blink=(t>19&&Math.sin(t*10)>0.3)?1:0.0; // blink late
  return `
  ${backdrop()}
  <div class="scene" style="opacity:${o};transform:scale(${sc})">
    <div style="font-weight:900;font-size:150px;letter-spacing:-.02em;line-height:1">
      СВЕ<span style="color:var(--green)">ЖАК</span>
    </div>
    <div style="font-size:40px;font-weight:600;color:rgba(243,238,228,.7);margin-top:22px">
      шеф и ИИ следят за складом вместе
    </div>
    <div class="chip" style="margin-top:54px;font-size:30px;padding:16px 38px;opacity:${url};
      border-color:var(--orange);color:var(--orange);font-weight:800">
      umirhack.tech
    </div>
    <img src="${IMG.avo}" style="position:absolute;right:120px;bottom:70px;width:300px;opacity:${avo};
      transform:translateY(${lerp(60,0,avo)}px) scaleY(${1-0.06*blink})">
  </div>`;
}

/* ============ master timeline ============ */
const CUT=0.28; // crossfade half-width
const spans=[[0,2.7],[2.5,6.2],[6,10.2],[10,14.2],[14,17.2],[17,20]];
const build=[scene1,scene2,scene3,scene4,scene5,scene6];

function frame(t){
  let html='';
  for(let i=0;i<spans.length;i++){
    const [a,b]=spans[i];
    if(t<a-CUT||t>b+CUT)continue;
    // fade in at start, fade out at end (except first/last edges)
    let o=1;
    if(i>0) o*=clamp((t-(a-CUT))/CUT,0,1);
    if(i<spans.length-1) o*=1-clamp((t-b)/CUT,0,1);
    if(o<=0)continue;
    html+=`<div class="scene" style="opacity:${o}">${build[i](t)}</div>`;
  }
  stage.innerHTML=html;
}

window.__frame=frame;
window.__ready=false;
// preload images + fonts, then flag ready
async function boot(){
  await Promise.all(Object.values(IMG).map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u;})));
  try{
    for(const w of [300,400,600,800,900]) await document.fonts.load(`${w} 40px Onest`,'Жакпросрочка123');
    await document.fonts.ready;
  }catch(e){}
  window.__ready=true;
}
boot();
</script>
</body>
</html>
